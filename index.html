<!doctype html>
<html lang="en" data-theme="vscode-dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="/theme-boot.js"></script>
    <title>Zeditor</title>
    <!-- 启动页关键样式内联：窗口首帧即是品牌画面而非白屏，
         CSP 已允许 style-src 'unsafe-inline'。主题色由 theme-boot.js
         预先写入的 data-theme 决定，深浅色均无闪烁。 -->
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #f7f8fa;
        color: #2e3640;
        opacity: 1;
        transition: opacity 220ms ease;
      }
      html[data-theme$='-dark'] #boot-splash {
        background: #15171b;
        color: #c6cdd6;
      }
      #boot-splash.boot-splash-hide {
        opacity: 0;
        pointer-events: none;
      }
      .boot-badge {
        width: 52px;
        height: 52px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 14px;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.02em;
        background: rgba(128, 128, 128, 0.12);
      }
      .boot-title {
        font-size: 13px;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        opacity: 0.72;
      }
      .boot-spinner {
        width: 18px;
        height: 18px;
        margin-top: 6px;
        border-radius: 50%;
        border: 2px solid rgba(128, 128, 128, 0.28);
        border-top-color: currentColor;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-spinner { animation: none; }
        #boot-splash { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-splash" aria-hidden="true">
      <div class="boot-badge">Z</div>
      <div class="boot-title">Zeditor</div>
      <div class="boot-spinner"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
