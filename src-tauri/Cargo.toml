[package]
name = "zeditor"
version = "0.4.5"
description = "A modern Markdown editor with Notion-style UI"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 不再强制启用 devtools：release 启动更轻量；debug 构建默认自带 devtools。
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream"] }
futures-util = "0.3"
base64 = "0.22"
sha1 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
urlencoding = "2.1"
headless_chrome = "1.0"
font-kit = "0.14"
regex = "1"
ed25519-dalek = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
semver = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
