name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag to build
        required: true
      # 局部重建入口：只重跑某一平台的构建并替换该平台的安装包，
      # 其余平台已发布的资产保持不变（全平台标签推送无需传该参数）。
      platforms:
        description: Which platforms to rebuild (partial runs keep other platforms' assets)
        required: false
        default: all
        type: choice
        options:
          - all
          - macos
          - linux
          - windows

permissions:
  actions: read
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  BUILD_PLATFORMS: ${{ github.event.inputs.platforms || 'all' }}

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  quality-checks:
    name: Release quality gate
    runs-on: windows-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Check frontend quality
        run: |
          npm run lint
          npm test
          npm run build
          npm audit --audit-level=high

      - name: Check Rust quality
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

  prepare-release:
    name: Prepare GitHub release
    needs: quality-checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Create release or refresh release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file="docs/releases/${RELEASE_TAG}.md"
          test -f "$notes_file" || { echo "Missing release notes: $notes_file"; exit 1; }
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "$BUILD_PLATFORMS" = "all" ]; then
              # 全平台重建：清空既有资产，避免新旧产物混在一起。
              gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.assets[].id' |
                while read -r asset_id; do
                  gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
                done
            else
              # 局部重建（如只重发 macOS）：保留其它平台已发布的安装包，
              # 本次构建的平台由 tauri-action「先删同名再上传」就地替换。
              echo "Partial build (${BUILD_PLATFORMS}): keeping other platforms' assets."
            fi
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Zeditor $RELEASE_TAG" \
              --notes-file "$notes_file"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Zeditor $RELEASE_TAG" \
              --notes-file "$notes_file"
          fi

  # macOS 与 Linux 拆成两个任务：任务级 if 读不到 matrix 上下文，
  # 拆开才能用 platform 输入精确跳过不需要重建的平台。
  build-macos:
    name: ${{ matrix.name }}
    needs: prepare-release
    if: ${{ github.event_name == 'push' || github.event.inputs.platforms == '' || github.event.inputs.platforms == 'all' || github.event.inputs.platforms == 'macos' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            target: aarch64-apple-darwin
          - name: macOS Intel
            target: x86_64-apple-darwin
    runs-on: macos-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Zeditor ${{ env.RELEASE_TAG }}
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

  build-linux:
    name: Linux x64
    needs: prepare-release
    if: ${{ github.event_name == 'push' || github.event.inputs.platforms == '' || github.event.inputs.platforms == 'all' || github.event.inputs.platforms == 'linux' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout release source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev libssl-dev rpm

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Zeditor ${{ env.RELEASE_TAG }}
          releaseDraft: false
          prerelease: false
          args: --target x86_64-unknown-linux-gnu

  build-windows:
    name: Windows x64 — two-stage signing
    needs: prepare-release
    if: ${{ github.event_name == 'push' || github.event.inputs.platforms == '' || github.event.inputs.platforms == 'all' || github.event.inputs.platforms == 'windows' }}
    runs-on: windows-latest
    env:
      WINDOWS_TARGET: x86_64-pc-windows-msvc
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
      SIGNPATH_EXECUTABLES_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_EXECUTABLES_ARTIFACT_CONFIGURATION_SLUG }}
      SIGNPATH_INSTALLERS_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_INSTALLERS_ARTIFACT_CONFIGURATION_SLUG }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.WINDOWS_TARGET }}

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Detect SignPath configuration
        id: signpath
        shell: pwsh
        run: |
          "enabled=false" >> $env:GITHUB_OUTPUT
          "SIGNPATH_ENABLED=false" >> $env:GITHUB_ENV
          Write-Host "Code signing disabled for this build."

      - name: Build unsigned application executable
        run: npm run tauri build -- --target ${{ env.WINDOWS_TARGET }} --no-bundle --no-sign

      - name: Collect unsigned inner executables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force signpath-stage-1 | Out-Null
          Copy-Item "src-tauri/target/$env:WINDOWS_TARGET/release/zeditor.exe" signpath-stage-1/zeditor.exe

      - name: Upload inner executables for provenance
        id: upload-unsigned-executables
        uses: actions/upload-artifact@v7
        with:
          name: windows-unsigned-executables-${{ github.run_id }}
          path: signpath-stage-1
          if-no-files-found: error
          retention-days: 14

      - name: Submit inner executables to SignPath (manual approval)
        if: steps.signpath.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_EXECUTABLES_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-executables.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-stage-1

      - name: Install signed inner executables
        if: steps.signpath.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $signedApp = Get-ChildItem signed-stage-1 -Recurse -File -Filter zeditor.exe | Select-Object -First 1
          if (-not $signedApp) { throw "SignPath did not return the application executable." }
          Copy-Item $signedApp.FullName "src-tauri/target/$env:WINDOWS_TARGET/release/zeditor.exe" -Force

      - name: Verify signed inner executables
        if: steps.signpath.outputs.enabled == 'true'
        shell: pwsh
        run: ./scripts/verify-windows-signatures.ps1 -BundleDirectory signed-stage-1

      - name: Bundle MSI and NSIS installers
        run: npm run tauri bundle -- --target ${{ env.WINDOWS_TARGET }} --bundles msi,nsis --no-sign

      - name: Collect unsigned installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force signpath-stage-2 | Out-Null
          $bundleRoot = "src-tauri/target/$env:WINDOWS_TARGET/release/bundle"
          $installers = Get-ChildItem $bundleRoot -Recurse -File | Where-Object { $_.Extension -in '.msi', '.exe' }
          if (($installers | Measure-Object).Count -lt 2) { throw "Expected both MSI and NSIS installers." }
          $installers | Copy-Item -Destination signpath-stage-2

      - name: Upload installers for provenance
        id: upload-unsigned-installers
        uses: actions/upload-artifact@v7
        with:
          name: windows-unsigned-installers-${{ github.run_id }}
          path: signpath-stage-2
          if-no-files-found: error
          retention-days: 14

      - name: Submit installers to SignPath (manual approval)
        if: steps.signpath.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLERS_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-installers.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-stage-2

      - name: Verify signed installers
        if: steps.signpath.outputs.enabled == 'true'
        shell: pwsh
        run: ./scripts/verify-windows-signatures.ps1 -BundleDirectory signed-stage-2

      - name: Publish Windows installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $source = if ($env:SIGNPATH_ENABLED -eq 'true') { 'signed-stage-2' } else { 'signpath-stage-2' }
          $installers = Get-ChildItem $source -Recurse -File | Where-Object { $_.Extension -in '.msi', '.exe' }
          foreach ($installer in $installers) {
            gh release upload $env:RELEASE_TAG $installer.FullName --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw "Uploading $($installer.Name) failed." }
          }
