name: Build Document Converter Modules

on:
  push:
    tags:
      - 'converter-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable converter-v* tag
        required: true

permissions:
  contents: write

env:
  CONVERTER_TAG: ${{ github.event.inputs.tag || github.ref_name }}

concurrency:
  group: converter-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            executable: converter/target/release/document_converter.exe
          - label: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            executable: converter/target/release/document_converter
          - label: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            executable: converter/target/release/document_converter
          - label: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            executable: converter/target/release/document_converter
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout converter source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.CONVERTER_TAG }}

      - name: Validate converter tag and source version
        shell: bash
        run: |
          version="${CONVERTER_TAG#converter-v}"
          test "$version" != "$CONVERTER_TAG"
          test "$(tr -d '\r\n' < src-tauri/resources/converter_version.txt)" = "$version"
          echo "CONVERTER_VERSION=$version" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Restore locked converter environment
        run: cargo fetch --manifest-path converter/Cargo.toml --locked

      - name: Build converter executable
        run: cargo build --manifest-path converter/Cargo.toml --release --locked

      - name: Verify converter protocol
        shell: bash
        run: |
          "${{ matrix.executable }}" --version-json > converter-version.json
          node -e "const v=require('./converter-version.json'); if(v.module_id!=='document-converter'||v.engine!=='anydoc'||v.version!==process.env.CONVERTER_VERSION||v.protocol_version!==1||v.target!=='${{ matrix.target }}') process.exit(1)"

      - name: Prepare module payload
        run: node scripts/prepare-converter-package.mjs "${{ matrix.executable }}" "${{ env.CONVERTER_VERSION }}" "${{ matrix.target }}" converter-package

      - name: Create Windows module archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path converter-package/* -DestinationPath "zeditor-converter-v${env:CONVERTER_VERSION}-${{ matrix.target }}.zip"

      - name: Create Unix module archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd converter-package
          zip -9 -r "../zeditor-converter-v${CONVERTER_VERSION}-${{ matrix.target }}.zip" .

      - name: Upload converter archive
        uses: actions/upload-artifact@v7
        with:
          name: converter-${{ matrix.target }}
          path: zeditor-converter-v${{ env.CONVERTER_VERSION }}-${{ matrix.target }}.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish converter release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.CONVERTER_TAG }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Resolve converter version
        shell: bash
        run: |
          version="${CONVERTER_TAG#converter-v}"
          test "$version" != "$CONVERTER_TAG"
          echo "CONVERTER_VERSION=$version" >> "$GITHUB_ENV"

      - name: Download native module archives
        uses: actions/download-artifact@v8
        with:
          pattern: converter-*
          path: converter-assets
          merge-multiple: true

      - name: Generate converter manifest
        run: node scripts/generate-converter-manifest.mjs converter-assets "${{ env.CONVERTER_VERSION }}" converter-assets

      - name: Publish immutable converter release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # 删除已有 release（如有），支持无签名模式重跑
          gh release delete "$CONVERTER_TAG" --yes 2>/dev/null || true
          gh release create "$CONVERTER_TAG" \
            --verify-tag \
            --title "Zeditor AnyDoc Converter v${CONVERTER_VERSION}" \
            --notes "Cross-platform AnyDoc document-conversion modules for Zeditor." \
            converter-assets/*

      - name: Update stable channel
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git tag -f converter-stable "$CONVERTER_TAG"
          git push origin refs/tags/converter-stable --force
          if ! gh release view converter-stable >/dev/null 2>&1; then
            gh release create converter-stable --verify-tag --title "Zeditor AnyDoc Converter Stable" --notes "Pointer to the current stable AnyDoc converter module."
          fi
          gh release upload converter-stable \
            converter-assets/converter-manifest.json \
            --clobber || true
          if [ -f converter-assets/converter-manifest.sig ]; then
            gh release upload converter-stable \
              converter-assets/converter-manifest.sig \
              --clobber || true
          fi

      - name: Verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          count=$(gh release view "$CONVERTER_TAG" --json assets --jq '.assets | length')
          test "$count" -ge 4 || { echo "Expected at least 4 assets, found $count"; exit 1; }
